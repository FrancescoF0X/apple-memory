<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Apple Products Memory</title>

  <style>
    :root {
      --bg: #f5f5f7;
      --card-back: #ffffff;
      --card-front: #f2f2f5;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --note: #a1a1a6;
      --border: rgba(0, 0, 0, 0.08);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      --green: #34c759;
      --overlay: rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      min-height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }

    .app {
      width: 100%;
      max-width: 430px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .hero-logo {
      width: 110px;
      height: auto;
      display: block;
      margin: 0 auto 10px;
    }

    .title {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0 0 4px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--muted);
      margin: 0;
    }

    .note {
      margin: 8px 0 0;
      font-size: 12px;
      color: var(--note);
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 18px 0 18px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .restart-btn {
      border: 0;
      background: var(--text);
      color: white;
      border-radius: 16px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow);
      appearance: none;
      -webkit-appearance: none;
    }

    .restart-btn:active {
      transform: scale(0.98);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      perspective: 1200px;
    }

    .card {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      cursor: pointer;
      perspective: 1000px;
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .card:focus-visible {
      outline: 2px solid rgba(0, 122, 255, 0.35);
      outline-offset: 4px;
      border-radius: 22px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.55s cubic-bezier(.2,.8,.2,1);
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 22px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      user-select: none;
      background-clip: padding-box;
    }

    .card-back {
      background: var(--card-back);
    }

    .apple-mark {
      font-size: clamp(34px, 8vw, 46px);
      color: #b7b7bd;
      transform: translateY(-1px);
    }

    .card-front {
      background: linear-gradient(180deg, #f6f6f8 0%, var(--card-front) 100%);
      transform: rotateY(180deg);
      padding: 8px;
    }

    .product-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      width: 100%;
      height: 100%;
      border-radius: 18px;
    }

    .product-icon {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .product-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: contrast(1.12) brightness(0.88);
    }

    .product-name {
      font-size: clamp(10px, 2.6vw, 12px);
      font-weight: 600;
      line-height: 1.15;
      color: var(--text);
      max-width: 90%;
    }

    .card.matched .card-face {
      border: 2px solid var(--green);
      box-shadow: 0 0 0 2px rgba(52, 199, 89, 0.12), var(--shadow);
    }

    .card.locked {
      pointer-events: none;
    }

    .card.shake .card-inner {
      animation: shake 0.38s ease-in-out;
    }

    @keyframes shake {
      0%   { transform: rotateY(180deg) translateX(0); }
      20%  { transform: rotateY(180deg) translateX(-5px); }
      40%  { transform: rotateY(180deg) translateX(5px); }
      60%  { transform: rotateY(180deg) translateX(-4px); }
      80%  { transform: rotateY(180deg) translateX(4px); }
      100% { transform: rotateY(180deg) translateX(0); }
    }

    .victory-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .victory-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .victory-card {
      width: min(100%, 360px);
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.55);
      transform: scale(0.94);
      transition: transform 0.35s ease;
    }

    .victory-overlay.show .victory-card {
      transform: scale(1);
    }

    .victory-title {
      font-size: 32px;
      font-weight: 750;
      letter-spacing: -0.03em;
      margin: 0 0 8px;
    }

    .victory-text {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.4;
    }

    .victory-btn {
      border: 0;
      background: var(--text);
      color: #fff;
      border-radius: 16px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <img src="./logo.png" alt="Logo Apple 50 anni" class="hero-logo">
      <h1 class="title">Apple Products Memory</h1>
      <p class="subtitle">Trova tutte le coppie</p>
      <p class="note">A cura di Francesco Parente</p>
    </header>

    <div class="topbar">
      <div class="badge">Coppie trovate: <span id="score">0</span>/8</div>
      <button class="restart-btn" id="restartBtn">Ricomincia</button>
    </div>

    <section class="board" id="board" aria-label="Griglia di gioco"></section>
  </main>

  <div class="victory-overlay" id="victoryOverlay" aria-hidden="true">
    <div class="victory-card">
      <h2 class="victory-title">Vittoria</h2>
      <p class="victory-text">Hai trovato tutte le coppie di prodotti Apple.</p>
      <button class="victory-btn" id="playAgainBtn">Gioca di nuovo</button>
    </div>
  </div>

  <script>
    const products = [
      { id: "iphone",  name: "iPhone",      img: "./iphone.png"  },
      { id: "ipad",    name: "iPad",        img: "./ipad.png"    },
      { id: "macbook", name: "MacBook",     img: "./macbook.png" },
      { id: "imac",    name: "iMac",        img: "./imac.png"    },
      { id: "watch",   name: "Apple Watch", img: "./watch.png"   },
      { id: "airpods", name: "AirPods",     img: "./airpods.png" },
      { id: "homepod", name: "HomePod",     img: "./homepod.png" },
      { id: "vision",  name: "Vision Pro",  img: "./vision.png"  }
    ];

    const board = document.getElementById("board");
    const scoreEl = document.getElementById("score");
    const restartBtn = document.getElementById("restartBtn");
    const playAgainBtn = document.getElementById("playAgainBtn");
    const victoryOverlay = document.getElementById("victoryOverlay");

    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let matches = 0;

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function createDeck() {
      const doubled = [...products, ...products].map((item, index) => ({
        ...item,
        uniqueKey: `${item.id}-${index}-${Math.random().toString(16).slice(2)}`
      }));
      return shuffle(doubled);
    }

    function updateScore() {
      scoreEl.textContent = matches;
    }

    function showVictory() {
      victoryOverlay.classList.add("show");
      victoryOverlay.setAttribute("aria-hidden", "false");
    }

    function hideVictory() {
      victoryOverlay.classList.remove("show");
      victoryOverlay.setAttribute("aria-hidden", "true");
    }

    function resetTurn() {
      [firstCard, secondCard] = [null, null];
      lockBoard = false;
    }

    function unflipWrongCards() {
      lockBoard = true;
      firstCard.classList.add("shake");
      secondCard.classList.add("shake");

      setTimeout(() => {
        firstCard.classList.remove("shake", "flipped");
        secondCard.classList.remove("shake", "flipped");
        resetTurn();
      }, 850);
    }

    function markAsMatched() {
      firstCard.classList.add("matched", "locked");
      secondCard.classList.add("matched", "locked");
      matches++;
      updateScore();

      if (matches === products.length) {
        setTimeout(showVictory, 500);
      }

      resetTurn();
    }

    function handleCardClick(e) {
      const card = e.currentTarget;

      if (
        lockBoard ||
        card === firstCard ||
        card.classList.contains("matched") ||
        card.classList.contains("flipped")
      ) {
        return;
      }

      card.classList.add("flipped");

      if (!firstCard) {
        firstCard = card;
        return;
      }

      secondCard = card;
      lockBoard = true;

      const isMatch = firstCard.dataset.productId === secondCard.dataset.productId;

      if (isMatch) {
        setTimeout(markAsMatched, 280);
      } else {
        unflipWrongCards();
      }
    }

    function createCard(product) {
      const card = document.createElement("button");
      card.className = "card";
      card.type = "button";
      card.dataset.productId = product.id;
      card.setAttribute("aria-label", `Carta ${product.name}`);

      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back">
            <div class="apple-mark"></div>
          </div>
          <div class="card-face card-front">
            <div class="product-wrap">
              <div class="product-icon">
                <img src="${product.img}" alt="${product.name}" draggable="false">
              </div>
              <div class="product-name">${product.name}</div>
            </div>
          </div>
        </div>
      `;

      card.addEventListener("click", handleCardClick);
      return card;
    }

    function initGame() {
      board.innerHTML = "";
      hideVictory();

      firstCard = null;
      secondCard = null;
      lockBoard = false;
      matches = 0;
      updateScore();

      const deck = createDeck();
      deck.forEach(product => {
        board.appendChild(createCard(product));
      });
    }

    restartBtn.addEventListener("click", initGame);
    playAgainBtn.addEventListener("click", initGame);

    initGame();
  </script>
</body>
</html>
